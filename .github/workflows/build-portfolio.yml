name: Build and verify BeFree portfolio website
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-portfolio.yml'
      - 'scripts/create-portfolio.py'
      - 'scripts/refine-introduction.py'
      - 'scripts/visual-introduction.css'
      - 'scripts/verify-visual-introduction.cjs'
permissions:
  contents: write
concurrency:
  group: befree-portfolio-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Read BeFree repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read the approved template without modifying its repository
        uses: actions/checkout@v4
        with:
          repository: keithkuang-BeLive/BeFree-MVertica
          ref: 3d0fe6d7ea613508f2d23261bbbb34e714a46c62
          path: _template
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply portfolio data and the visual-first introduction
        run: |
          python scripts/create-portfolio.py _template
          python scripts/refine-introduction.py
          node --check public/assets/index-CHKnvv48.js
          npm run build
      - name: Install isolated browser verification dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Verify both website formats, three languages and mobile interactions
        run: node scripts/verify-visual-introduction.cjs
      - name: Publish only the tested website files
        id: publish
        run: |
          cp verification/browser-report.json docs/browser-verification.json
          git config user.name 'BeFree Website Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public index.html docs README.md .gitignore package.json vercel.json scripts/build.mjs scripts/serve.mjs
          git diff --cached --quiet || git commit -m 'Publish visual-first BeFree: 4500 rooms, complete team, Google reviews and shorter copy'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify the published preview in a real browser
        run: node scripts/verify-visual-introduction.cjs --remote "https://raw.githack.com/keithkuang-BeLive/BeFree/${{ steps.publish.outputs.sha }}/index.html"
      - name: Store public-preview verification
        run: |
          cp verification/public-preview-v2.json docs/public-preview-verification.json
          git add docs/public-preview-verification.json
          git diff --cached --quiet || git commit -m 'Confirm revised BeFree public preview across languages and screen sizes'
          git push origin HEAD:main
          echo 'Preview: https://raw.githack.com/keithkuang-BeLive/BeFree/${{ steps.publish.outputs.sha }}/index.html' >> "$GITHUB_STEP_SUMMARY"
      - name: Save the revised website and review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: befree-visual-introduction-review
          path: |
            verification/
            public/
            docs/
          retention-days: 7
