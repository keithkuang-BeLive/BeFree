name: Check public BeFree website preview
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Verify the actual public review website
        run: node scripts/verify-visual-introduction.cjs --remote "https://raw.githack.com/keithkuang-BeLive/BeFree/$(git rev-parse HEAD)/index.html"
      - name: Store current public-preview verification
        run: |
          cp verification/public-preview-v2.json docs/public-preview-verification.json
          git config user.name 'BeFree Website Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/public-preview-verification.json
          git diff --cached --quiet || git commit -m 'Verify the revised public BeFree preview'
          git push origin HEAD:main
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-preview-check
          path: verification/
          retention-days: 7
